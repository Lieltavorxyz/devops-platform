name: CI

# PRs are gated locally by the devops-reviewer agent (.claude/agents/).
# This only re-checks main after a merge, as a safety net.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Build · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Regression guard: a relative base ('./assets/') blanks every nested
      # route on Cloudflare Pages. Assets must be referenced from the root.
      - name: Check asset paths are absolute
        run: |
          if grep -q '"\./assets/' dist/index.html; then
            echo "dist/index.html references ./assets/ — set base: '/' in vite.config.js" >&2
            exit 1
          fi
